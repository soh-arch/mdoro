name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The shared package is where the rules live: the state machine, the log
    # format, the colour system and its contrast checks. It builds without Xcode,
    # so it is what CI can hold onto.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/MdoroCore
        run: swift test

  mac:
    # The app side's wiring: that the server is asked to start, that closing the
    # pairing screen folds it, that a refusal reaches the log. None of it needs a
    # device, a LAN or a person -- it sat outside CI because of where it is kept,
    # not because of what it needs. POL-225.
    #
    # Only `MdoroMacTests`. The scheme's test action also carries
    # `PomodoroMacUITests`, which drives the app through the interface and is a
    # different kind of run: slower, and it wants a session to draw into.
    #
    # Signing is turned off rather than configured. `Config/Signing.xcconfig`
    # names a development team that no runner has, and these tests reach the
    # Keychain and the notification centre through injected seams rather than the
    # real ones, so an unsigned host is enough for them. A test that needed a real
    # signature would be telling us it belongs on the owner's Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: xcodebuild test
        run: |
          set -o pipefail && xcodebuild test \
            -project ./PomodoroMac/PomodoroMac.xcodeproj \
            -scheme MdoroMac \
            -destination 'platform=macOS' \
            -only-testing:MdoroMacTests \
            -derivedDataPath /tmp/mdoro-ci \
            CODE_SIGNING_ALLOWED=NO

  tools:
    # The document checks and the axis tool are what a session runs before it
    # touches anything, and for a while nothing started them: one of them sat
    # here unable to parse until somebody happened to type the command. Every
    # version in the supported range is built, not just the ends -- that fault
    # parsed on some of them and not others, and the interpreter a session is
    # handed can move under us. fail-fast is off so a failure on one version
    # does not hide the others.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: the tools parse
        run: python -m compileall -q Tools
      - name: check-docs
        run: python Tools/check-docs.py
      - name: a role runs on a checkout it cannot keep
        # POL-201 was the tools nobody ran, and parsing is not starting. This
        # one is reached for only when work goes to a role, which is not every
        # session, so nothing else would notice it breaking.
        run: python Tools/run-in-a-worktree.py -- true
      - name: and still notices what a role touched
        # Starting is not noticing. The step above runs a command that touches
        # nothing, so every branch worth having -- moved, escaped, refused --
        # would be exercised by nobody. These build repositories of their own.
        run: python Tools/test-run-in-a-worktree.py
