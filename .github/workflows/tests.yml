name: tests

on:
  pull_request:

# **A run on `main` after a merge repeats the run the pull request already did, on the same
# commit.** Pure duplication, and duplication on macOS is expensive: GitHub bills a macOS minute
# at ten times a Linux one and rounds every job up to the minute on its own. POL-239.
concurrency:
  # Three pushes to one branch used to mean three full runs to the end. Only the last one is read.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  what-changed:
    # **A cheap gate in front of the expensive room.** A minute spent here to skip twenty there
    # pays for itself many times over. Documents, the role briefs and the Python tools cannot
    # break Swift; everything else can, the workflow itself included. POL-239.
    #
    # `[^/]*\.md$` reaches only the root, so the issue templates are named on their own. The
    # workflow is deliberately not excluded: a change to it has to be able to prove itself.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "$changed"
          if echo "$changed" | grep -qvE '^(docs/|\.claude/|Tools/|\.github/ISSUE_TEMPLATE/|[^/]*\.md$)'; then
            echo "code=yes" >> "$GITHUB_OUTPUT"
          else
            echo "code=no" >> "$GITHUB_OUTPUT"
          fi

  swift:
    # **One macOS job, not two.** The shared package holds the rules — the state machine, the log
    # format, the colour system and its contrast checks. The app side holds the wiring that keeps
    # the Mac off the air without a readable identity, keeps what the user wrote out of the
    # diagnostic log, and keeps a Keychain that will not answer from being overwritten. Both need
    # the same runner, and each job is rounded up to the minute by itself, so splitting them spent
    # a whole extra minute at the tenfold rate for nothing. POL-239.
    #
    # `swift test` goes first: it is the faster of the two, and if the rules are broken there is no
    # point building an app around them.
    #
    # Only `MdoroMacTests` on the app side. The scheme's test action also carries
    # `PomodoroMacUITests`, which drives the app through its interface and is a different kind of
    # run: slower, and it wants a session to draw into.
    #
    # Signing is turned off rather than configured. `Config/Signing.xcconfig` names a development
    # team no runner has, and these tests reach the Keychain and the notification centre through
    # injected seams rather than the real ones, so an unsigned host is enough. A test that needed a
    # real signature would be telling us it belongs on the owner's Mac.
    #
    # **The gate fails safe.** If `what-changed` does not succeed it has no answer to give, and a
    # dependent job with an unmet `needs` is reported as `skipped` — a word that reads as "not
    # needed" when the truth is "nobody decided". That happened four times in a row on #90, where
    # the account was out of minutes and no runner was assigned. So: run the tests unless the gate
    # actually said no. A broken gate then costs one macOS run instead of hiding an unrun suite,
    # and `cancelled()` is excluded so the concurrency group above still stops work it cancels.
    # POL-240.
    needs: what-changed
    if: ${{ !cancelled() && (needs.what-changed.result != 'success' || needs.what-changed.outputs.code == 'yes') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/MdoroCore
        run: swift test
      - name: xcodebuild test
        run: |
          set -o pipefail && xcodebuild test \
            -project ./PomodoroMac/PomodoroMac.xcodeproj \
            -scheme MdoroMac \
            -destination 'platform=macOS' \
            -only-testing:MdoroMacTests \
            -derivedDataPath /tmp/mdoro-ci \
            -resultBundlePath /tmp/mdoro-ci/result.xcresult \
            CODE_SIGNING_ALLOWED=NO
      # **Green has to mean "it ran and it passed".** `xcodebuild` prints TEST SUCCEEDED having run
      # nothing at all — measured: a selector naming tests absent from the checkout returned success
      # with a count of zero. One mistyped character in `-only-testing` buys a green that means
      # nothing, and until now the only thing covering that was somebody counting the lines by hand.
      # So the count is read on **every** run, not just on failure, and zero is a red. POL-240.
      #
      # The check went into the step that already existed to say *what* failed, so no step was
      # added. That step exists because `xcodebuild`'s own output carries the line that a test
      # failed and not one word of why — not the expectation, not the file, not even a marker
      # printed on purpose to be grepped for. The bundle has all of it.
      #
      # **The summary is checked for being JSON at all, not for being non-empty.** A first attempt
      # used `[ -s ]`, and a review found the hole: a bundle holding one newline is not empty, so
      # every `jq` after it returned the empty string, the numeric comparison became a shell error
      # inside an `if`, and the step went green having measured nothing — the exact shape this step
      # exists to stop. `jq -e` separates the three cases: 0 is readable, 4 is no document, 5 is
      # not JSON. Both failures print what was written instead, which is also the debugging the
      # first attempt had dropped.
      #
      # The scalars are printed by whatever names the bundle uses rather than by names guessed here,
      # so a renamed field shows up as itself. The count is then read only when it really is a
      # number, so a renamed or retyped field reads as zero and fails closed.
      - name: how many ran, and what failed
        if: ${{ !cancelled() }}
        run: |
          xcrun xcresulttool get test-results summary \
            --path /tmp/mdoro-ci/result.xcresult --format json > /tmp/summary.json || true
          if ! jq -e . /tmp/summary.json > /dev/null 2>&1; then
            echo "::error::the test summary is missing or is not JSON"
            echo "--- what was written instead ---"
            head -c 4000 /tmp/summary.json || true
            echo "--- the bundle itself ---"
            xcrun xcresulttool get --legacy --path /tmp/mdoro-ci/result.xcresult --format json | head -c 200000
            exit 1
          fi
          jq -r 'to_entries[] | select(.value | type == "number" or type == "string") | "\(.key): \(.value)"' \
            /tmp/summary.json
          jq -r '.testFailures[]? | "\n--- \(.testName // "?") (\(.targetName // "?")) ---\n\(.failureText // "no text")"' \
            /tmp/summary.json
          ran=$(jq -r 'if (.totalTestCount | type) == "number" then .totalTestCount else 0 end' \
            /tmp/summary.json)
          if [ "$ran" -eq 0 ]; then
            echo "::error::zero tests ran; TEST SUCCEEDED means nothing here"
            exit 1
          fi

  tools:
    # The document checks and the axis tool are what a session runs before it touches anything, and
    # for a while nothing started them: one of them sat here unable to parse until somebody
    # happened to type the command. Every version in the supported range is built, not just the
    # ends — that fault parsed on some of them and not others, and the interpreter a session is
    # handed can move under us. fail-fast is off so a failure on one version does not hide the
    # others. These are Linux minutes, which is why the matrix is affordable at all.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: the tools parse
        run: python -m compileall -q Tools
      - name: check-docs
        run: python Tools/check-docs.py
      - name: a role runs on a checkout it cannot keep
        # POL-201 was the tools nobody ran, and parsing is not starting. This one is reached for
        # only when work goes to a role, which is not every session, so nothing else would notice
        # it breaking.
        run: python Tools/run-in-a-worktree.py -- true
      - name: and still notices what a role touched
        # Starting is not noticing. The step above runs a command that touches nothing, so every
        # branch worth having -- moved, escaped, refused -- would be exercised by nobody. These
        # build repositories of their own.
        run: python Tools/test-run-in-a-worktree.py
